name: Build and Push docker image

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: 'Image tag / version (e.g. 1.2.3 or v1.2.3)'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: docker_environment

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.tag }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          RAW="${RAW#refs/tags/}"
          VERSION="${RAW#v}"
          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([-+].+)?$ ]]; then
            ASM_VERSION="$VERSION"
          else
            ASM_VERSION="0.0.0"
          fi
          echo "raw=${RAW}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asm=${ASM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using image tag ${RAW}, assembly ${ASM_VERSION}"

      - name: Build docker image
        run: |
          docker build -f ./src/TeslaCamViewer/Dockerfile \
            --build-arg "APP_VERSION=${{ steps.version.outputs.asm }}" \
            --build-arg "APP_INFORMATIONAL_VERSION=${{ steps.version.outputs.raw }}" \
            -t "thijswm/tesla-cam-viewer:${{ steps.version.outputs.raw }}" \
            -t "thijswm/tesla-cam-viewer:${{ steps.version.outputs.version }}" \
            -t thijswm/tesla-cam-viewer:latest \
            ./src/TeslaCamViewer

      - name: Push image
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u thijswm --password-stdin
          docker push "thijswm/tesla-cam-viewer:${{ steps.version.outputs.raw }}"
          docker push "thijswm/tesla-cam-viewer:${{ steps.version.outputs.version }}"
          docker push thijswm/tesla-cam-viewer:latest
